  /v4/soccer/scores/{format}/CompetitionDetails/{competition}:
    get:
      description: Full scores and gameday info delivered live and post-game. Live data includes half and score info, delivered by competition.
      operationId: soccer_v4_scores_games___by_competition__live___final
